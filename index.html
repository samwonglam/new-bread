    <style>
        :root {
            --dora-blue: #00A0E9;
            --dora-dark-blue: #0080C6;
            --dora-red: #E60012;
            --dora-yellow: #FFDF00;
            --dora-bread-crust: #B87333;
            --dora-bread-toast: #7A3B00;
        }

        html, body {
            height: 100%;
            width: 100%;
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at top center, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px -3px rgba(0, 0, 0, 0.15);
        }

        .card-front {
            background: linear-gradient(135deg, var(--dora-blue) 0%, var(--dora-dark-blue) 100%);
            border: 3.5px solid #ffffff;
            color: white;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.3) 0%, transparent 60%),
                radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 2px);
            background-size: 100% 100%, 14px 14px;
        }

        .card-back {
            background: linear-gradient(180deg, #FFFDF5 0%, #FDF0D0 100%);
            transform: rotateY(180deg);
            border: 5px solid var(--dora-bread-crust);
            box-shadow: inset 0 0 12px rgba(184, 115, 51, 0.2);
        }

        .card.matched .card-back {
            border-color: #10b981;
            background: #ecfdf5;
            animation: breadPulse 1.2s infinite alternate ease-in-out;
        }

        .card.hint-glow .card-front {
            animation: gadgetGlow 0.8s infinite alternate ease-in-out;
            border-color: var(--dora-yellow);
        }

        @keyframes breadPulse {
            0% { box-shadow: 0 0 6px #10b981; transform: scale(1); }
            100% { box-shadow: 0 0 20px #059669; transform: scale(1.02); }
        }

        @keyframes gadgetGlow {
            0% { box-shadow: 0 0 4px var(--dora-yellow); }
            100% { box-shadow: 0 0 22px #f59e0b; transform: scale(1.03); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-2deg); }
            40%, 80% { transform: translateX(6px) rotate(2deg); }
        }

        .shake {
            animation: shake 0.35s ease-in-out;
        }

        .toasted-text {
            color: var(--dora-bread-toast);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.9);
            font-weight: 900;
        }
